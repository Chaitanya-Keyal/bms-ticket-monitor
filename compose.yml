# Local run. First: cp .env.example .env; mkdir config; cp watches.example.toml config/watches.toml
# (a folder is mounted, not the file, so edits that replace the file are still seen)
services:
  monitor:
    build: .
    env_file: .env
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    restart: unless-stopped
    volumes:
      - ./config:/config:ro
      - data:/data
    mem_limit: 256m
    cpus: 0.5

volumes:
  data: {}
